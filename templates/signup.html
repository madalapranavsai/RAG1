{% extends "base.html" %}

{% block title %}Sign Up - DocuMind RAG{% endblock %}

{% block content %}
<div class="min-h-full flex items-center justify-center p-4">
  <div class="w-full max-w-md glass-card rounded-2xl p-8 shadow-2xl border border-slate-800">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 mb-4 shadow-[0_0_20px_rgba(99,102,241,0.2)]">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Create Workspace</h1>
      <p class="text-sm text-slate-400 mt-1">Start your multi-tenant RAG platform</p>
    </div>

    <div id="error-alert" class="hidden mb-5 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs"></div>
    <div id="success-alert" class="hidden mb-5 p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs"></div>

    <form id="signup-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="email">Work Email</label>
        <input 
          id="email" 
          name="email" 
          type="email" 
          required 
          placeholder="developer@company.com"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="password">Password</label>
        <input 
          id="password" 
          name="password" 
          type="password" 
          required 
          minlength="6"
          placeholder="At least 6 characters"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
        />
      </div>

      <button 
        id="submit-btn"
        type="submit" 
        class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 cursor-pointer mt-2"
      >
        <span>Create Account</span>
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-400">
      Already have an account? 
      <a href="/login" class="text-indigo-400 hover:text-indigo-300 font-semibold underline underline-offset-4 ml-1">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById('signup-form');
  const errorAlert = document.getElementById('error-alert');
  const successAlert = document.getElementById('success-alert');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorAlert.classList.add('hidden');
    successAlert.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>Creating workspace...</span>';

    const formData = new FormData(form);

    try {
      const res = await fetch('/api/auth/signup', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || 'Registration failed');
      }

      if (data.session_active) {
        window.location.href = '/dashboard';
      } else {
        successAlert.textContent = 'Account created! Please check your email for confirmation or sign in.';
        successAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Create Account</span>';
      }
    } catch (err) {
      errorAlert.textContent = err.message;
      errorAlert.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span>Create Account</span>';
    }
  });
</script>
{% endblock %}
